<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Petite image promotionnelle</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        padding: 0 36px;
        font: 16px/1.4 system-ui, "Segoe UI", sans-serif;
        color: #f4f4f5;
        background: radial-gradient(circle at 20% 30%, #3a1d22 0, #141416 65%);
      }
      .head { display: flex; align-items: center; gap: 16px; }
      .head img { width: 64px; height: 64px; }
      h1 { margin: 0; font-size: 30px; line-height: 1.1; }
      h1 span { color: #ff424d; }
      p { margin: 0; color: #c4c4cc; font-size: 17px; }
    </style>
  </head>
  <body>
    <div class="head">
      <img src="../../icons/icon-128.png" alt="" />
      <h1>Patreon Live Chat<span>+</span></h1>
    </div>
    <p>Réponses, mentions et émotes 7TV dans le chat des lives Patreon.</p>
  </body>
</html>
